name: build-and-publish

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: tdewolff/minify
  PACKAGE_NAME: minify-go
  GO_VERSION: 1.26.6
  CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      skip: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Detect latest upstream tag
        id: detect
        run: |
          tag=$(git ls-remote --tags "https://github.com/$UPSTREAM_REPO.git" \
            | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v '\^{}' \
            | awk -F/ '{print $3}' \
            | sort -V \
            | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Skip if upstream unchanged
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .upstream-version
          key: min-go-upstream-${{ steps.detect.outputs.tag }}

  build-linux-x86_64:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
      CIBW_MANYLINUX_PYPY_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
      - name: Rename PyPI project
        run: sed -i.bak "s/name=\"tdewolff-minify\"/name=\"$PACKAGE_NAME\"/" bindings/py/setup.py && rm -f bindings/py/setup.py.bak
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse
        env:
          CIBW_BEFORE_ALL: |
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://go.dev/dl/go1.26.6.linux-amd64.tar.gz -o /tmp/go.tar.gz
            else
              wget -q https://go.dev/dl/go1.26.6.linux-amd64.tar.gz -O /tmp/go.tar.gz
            fi
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tar.gz
            export PATH="/usr/local/go/bin:$PATH"
            make -C bindings/py compile
            cp bindings/py/src/minify/minify.so bindings/py/minify.so
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-linux-x86_64
          path: wheelhouse/*.whl

  build-linux-aarch64:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    env:
      CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
      CIBW_MANYLINUX_PYPY_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
      - name: Rename PyPI project
        run: sed -i.bak "s/name=\"tdewolff-minify\"/name=\"$PACKAGE_NAME\"/" bindings/py/setup.py && rm -f bindings/py/setup.py.bak
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse
        env:
          CIBW_BEFORE_ALL: |
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://go.dev/dl/go1.26.6.linux-arm64.tar.gz -o /tmp/go.tar.gz
            else
              wget -q https://go.dev/dl/go1.26.6.linux-arm64.tar.gz -O /tmp/go.tar.gz
            fi
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tar.gz
            export PATH="/usr/local/go/bin:$PATH"
            make -C bindings/py compile
            cp bindings/py/src/minify/minify.so bindings/py/minify.so
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-linux-aarch64
          path: wheelhouse/*.whl

  build-macos-x86_64:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: 11.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
      - name: Rename PyPI project
        run: sed -i.bak "s/name=\"tdewolff-minify\"/name=\"$PACKAGE_NAME\"/" bindings/py/setup.py && rm -f bindings/py/setup.py.bak
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile Go extension
        run: |
          make -C bindings/py compile
          cp bindings/py/src/minify/minify.so bindings/py/minify.so
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-macos-x86_64
          path: wheelhouse/*.whl

  build-macos-arm64:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: 11.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
      - name: Rename PyPI project
        run: sed -i.bak "s/name=\"tdewolff-minify\"/name=\"$PACKAGE_NAME\"/" bindings/py/setup.py && rm -f bindings/py/setup.py.bak
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile Go extension
        run: |
          make -C bindings/py compile
          cp bindings/py/src/minify/minify.so bindings/py/minify.so
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-macos-arm64
          path: wheelhouse/*.whl

  build-windows:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
      - name: Rename PyPI project
        shell: bash
        run: sed -i.bak "s/name=\"tdewolff-minify\"/name=\"$PACKAGE_NAME\"/" bindings/py/setup.py && rm -f bindings/py/setup.py.bak
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile Go extension
        shell: bash
        run: |
          make -C bindings/py compile
          cp bindings/py/src/minify/minify.so bindings/py/minify.so
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-windows
          path: wheelhouse/*.whl

  smoke:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-arm64, build-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: build-linux-x86_64
            runner: ubuntu-latest
            py: python3
            activate: .venv/bin/activate
          - artifact: build-linux-aarch64
            runner: ubuntu-24.04-arm
            py: python3
            activate: .venv/bin/activate
          - artifact: build-macos-x86_64
            runner: macos-15-intel
            py: python3
            activate: .venv/bin/activate
          - artifact: build-macos-arm64
            runner: macos-15
            py: python3
            activate: .venv/bin/activate
          - artifact: build-windows
            runner: windows-latest
            py: python
            activate: .venv/Scripts/activate
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.py }} -m venv .venv
          source ${{ matrix.activate }}
          pip install -q dist/*.whl
          python smoke.py

  smoke-musl:
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build-linux-x86_64
          path: dist
      - name: Smoke test musllinux wheel
        run: |
          docker run --rm -v "$PWD/dist:/dist" -v "$PWD/smoke.py:/smoke.py" \
            python:3.12-alpine sh -c \
            "pip install --no-cache-dir /dist/*cp312*musllinux*x86_64.whl && python /smoke.py"

  publish:
    needs: [detect, smoke, smoke-musl]
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Check if version already published
        id: check
        run: |
          if curl -fsS "https://pypi.org/pypi/$PACKAGE_NAME/${{ needs.detect.outputs.version }}/json" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
      - name: Mark upstream version as built
        if: steps.check.outputs.exists == 'true' || steps.publish.outcome == 'success'
        run: mkdir -p .upstream-version && echo "${{ needs.detect.outputs.tag }}" > .upstream-version/marker
      - name: Save cache
        if: steps.check.outputs.exists == 'true' || steps.publish.outcome == 'success'
        uses: actions/cache@v6.1.0
        with:
          path: .upstream-version
          key: min-go-upstream-${{ needs.detect.outputs.tag }}